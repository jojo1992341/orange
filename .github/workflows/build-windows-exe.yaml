name: build-windows-exe

# Builds a Windows .exe (and the NSIS installer) of this fork on GitHub's Windows
# runners, then publishes both as downloadable artifacts. Nothing is released: the
# artifacts are private to the repository.
#
# No secret is required. If guide downloads or the account features must talk to the
# real Ganymede endpoints, set the repository *variables* GANYMEDE_API,
# GANYMEDE_WEBSITE, GANYMEDE_API_KEY and GANYMEDE_CLIENT_ID (Settings > Secrets and
# variables > Actions > Variables); the fallbacks below are only there to let the
# compiler run.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche ou tag à compiler'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    env:
      GANYMEDE_WEBSITE: ${{ vars.GANYMEDE_WEBSITE || 'https://ganymede-dofus.com' }}
      GANYMEDE_API: ${{ vars.GANYMEDE_API || 'https://ganymede-app.com/api' }}
      GANYMEDE_API_KEY: ${{ vars.GANYMEDE_API_KEY || 'personal-build' }}
      GANYMEDE_CLIENT_ID: ${{ vars.GANYMEDE_CLIENT_ID || 'personal-build' }}
      # Sentry is only compiled in release builds. An unreachable DSN is harmless: the
      # app runs, it just cannot report crashes to the official project.
      SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://00000000000000000000000000000000@o0.ingest.sentry.io/0' }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          shared-key: 'tauri-windows'

      - name: install frontend dependencies
        run: pnpm i --frozen-lockfile

      - name: lint, format, typecheck & tests
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test

      - name: build (tauri)
        # createUpdaterArtifacts is disabled: signing an updater artifact needs the
        # official private key, and this fork is not distributed through the updater.
        run: pnpm tauri build --config scripts/build-windows-config.json

      - name: upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ganymede-windows-portable
          path: src-tauri/target/release/ganymede.exe
          if-no-files-found: error

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ganymede-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
